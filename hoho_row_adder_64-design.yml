vlsi.inputs.pin.assignments:
  - pins: "clk"
    layers: ["M3"]
#    location: [395.0, 660.0]
  - pins: "rst"
    layers: ["M3"]

vlsi.inputs.placement_constraints:
  - path: "hoho_row_adder_64"
    type: toplevel
    x: 0
    y: 0
    width: 60
    height: 640
    margins:
      top: 0
      bottom: 0
      left: 0
      right: 0
vlsi.inputs.clocks:
  - name: "clk"
    period: "1 ns"
    uncertainty: "0.01 ns"

vlsi.inputs.supplies:
  power:
    - "name": "VDD"
      "pins": ["VDD", "VNW"]
    # - "name": "IOVDD"
    #   "pins": ["DVDD"]
    #   "voltage": "3.3 V"
    # - "name": "AVDD"
    #   "pins": ["AVDD"]
    #   "voltage": "1.2 V"
  ground:
    - "name": "VSS"
      "pins": ["VSS", "VPW"]
    # - "name": "AVSS"
    #   "pins": "AVSS"
  VDD: "1.2 V"
  VSS: "0 V"

