vlsi.inputs.custom_sdc_constraints:
  - "set_max_delay 0.9 -from [get_clocks clock_io] -to [get_ports VSAF_EN]"
  - "set_max_delay 0.9 -from [get_clocks clock_io] -to [get_ports VSAB_EN]"
  - "set_max_delay 0.6 -from [get_clocks clock_io] -to [get_ports RWLF_pre*]"
  - "set_max_delay 0.6 -from [get_clocks clock_io] -to [get_ports RWLB_pre*]"
