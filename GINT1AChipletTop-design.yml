vlsi.inputs.placement_constraints:
  - path: "GINT1AChipletTop"
    type: toplevel
    x: 0
    y: 0
    width: 1400
    height: 1400
    margins:
      top: 200
      bottom: 200
      left: 200
      right: 200
  - path: "GINT1AChipletTop/a"
    master: "array_with_periph"
      # SIZE 492.876 BY 442.899 ;
      # ORIGIN 17.183 72.429 ;
    type: "hardmacro"
    x: 450
    y: 550
    orientation: "R0"
  - type: "obstruction"
    path: "GINT1AChipletTop/block_place_around_array"
    # around array_with_periph
    obs_types: ["place"]
    x: 430
    y: 530.4
    width: 533
    height: 482.4
    layers: ["M1", "M2", "M3", "M4", "M5", "M6"]
  - type: "obstruction"
    path: "GINT1AChipletTop/block_power_around_array"
    # around array_with_periph
    obs_types: ["power"]
    x: 434
    y: 530
    width: 525
    height: 483.2
    layers: ["M1", "M2", "M3", "M4", "M5", "M6"]    
  - type: "obstruction"
    path: "GINT1AChipletTop/block_EB_at_array_east_edge"
    obs_types: ["power"]
    x: 910
    y: 550
    height: 442.899
    width: 20
    layers: ["EB"]
  - type: "obstruction"
    path: "GINT1AChipletTop/block_EA_at_array_north_edge"
    obs_types: ["power"]
    x: 500
    y: 950
    width: 400
    height: 25
    layers: ["EA"]

vlsi.inputs.clocks:
  # - name: "iocell_clock_io_pad"
  - name: "clock_io"
    period: "10 ns"
    uncertainty: "0.01 ns"
  - name: "clock2_io"
    period: "10 ns"
    uncertainty: "0.01 ns"

vlsi.user.custom_physical_library: "/home/tinish/gint-project/custom/bidirectional_sram_minsize.lef"
par.inputs.io_plan_file: "/home/tinish/gint-project/digital/GINT1A.io"

vlsi.inputs.supplies:
  power:
    - "name": "VDD"
      "pins": ["VDD", "VNW"]
    # - "name": "IOVDD"
    #   "pins": ["DVDD"]
    #   "voltage": "3.3 V"
    # - "name": "AVDD"
    #   "pins": ["AVDD"]
    #   "voltage": "1.2 V"
  ground:
    - "name": "VSS"
      "pins": ["VSS", "VPW"]
    # - "name": "AVSS"
    #   "pins": "AVSS"
  VDD: "1.2 V"
  VSS: "0 V"

par.generate_power_straps_options.by_tracks:
  generate_rail_layer: true
  power_utilization_EA: 0.5
  power_utilization_EB: 0.5

par.innovus.design_flow_effort: "extreme"



