synthesis.inputs:
  input_files:
    #- "external/xormix/verilog/rtl/xormix32.v"
    #- "src/prng_top/functional/verilog.v"
    - "src/main_control_new/functional/verilog.v"
    #- "test/main_control_new_tb/functional/verilog.v"
  input_files_meta: "append"
  top_module: "main_control_new"

sim.inputs:
  input_files:
    - "xormix/verilog/rtl/xormix32.v"
    - "src/prng_top/prng_top.v"
    - "test/prng_top/prng_tb.v"
  input_files_meta: "append"
  top_module: "prng_tb"
  tb_name: "prng_tb"
  tb_dut: "dut"
  timescale: "1ns/1ps"
  # defines: ["DEBUG"]
  # defines_meta: "append"

#vlsi.inputs.pin.assignments:
#  - pins: "*"
#    side: "top"
#    layers: ["M2", "M4", "M6"]
#    preplaced: false
vlsi.inputs.pin.assignments:
  - pins: "*"
    side: "top"
    layers: ["M2", "M4", "M6"]
    preplaced: false

vlsi.inputs.placement_constraints:
  - path: "main_control_new"
    type: toplevel
    x: 0
    y: 0
    width: 500
    height: 500
    margins:
      top: 0
      bottom: 0
      left: 0
      right: 0
      
synthesis.clock_gating_mode: auto
vlsi.inputs.default_output_load: "0.1 pF"

vlsi.inputs.clocks: [
  {name: "clk", period: "10ns", uncertainty: "0.1ns"},
  {name: "clk2", period: "10ns", uncertainty: "0.1ns"}
]

vlsi.inputs.custom_sdc_constraints:
  - "set_wire_load_mode top"
  - "set_wire_load_model -name none"
#  - "set_max_delay 0.9 -from [get_clocks clk] -to [get_ports VSAF_EN]"
#  - "set_max_delay 0.9 -from [get_clocks clk] -to [get_ports VSAB_EN]"
#  - "set_max_delay 1.2 -from [get_ports clk] -to [get_ports RWLF_pre*]"
#  - "set_max_delay 0.4 -from [get_ports clk] -to [fp_mode]"
#  - "set_min_delay 0.0 -from [get_ports clk] -to [get_ports RWLF_pre*]"
#  - "set_min_delay 0.0 -from [fp_mode] -to [get_ports RWLF_pre*]"
#  - "set_max_delay 0.9 -from [get_clocks clk] -to [get_ports RWLB_pre*]"
vlsi.inputs.output_loads:
  - name: "RWLF_pre*"
    load: "0.012 pF"
  - name: "RWLB_pre*"
    load: "0.0032 pF"
  - name: "WTA_SEL0*"
    load: "0.009 pF"
  - name: "WTA_SEL1*"
    load: "0.009 pF"
  - name: "LIT_SEL*"
    load: "0.02 pF"
  - name: "BP_MUX_SEL*"
    load: "0.02 pF"
  - name: "DRDN_WBLp*"
    load: "0.005 pF"
  - name: "DRUPn_WBLp*"
    load: "0.005 pF"
  - name: "DRDN_WBLn*"
    load: "0.005 pF"
  - name: "DRUPn_WBLn*"
    load: "0.005 pF"
  - name: "WWL_pre*"
    load: "0.005 pF"
  - name: "VSAB_EN"
    load: "0.35 pF"
  - name: "VSAF_EN"
    load: "1.3 pF" 
  - name: "FP_PUn"
    load: "0.211 pF" 
  - name: "BP_PUn"
    load: "0.109 pF"
  - name: "WTA_EN"
    load: "0.144 pF"
  - name: "RESETn"
    load: "0.158 pF"
  - name: "fp_mode"
    load: "0.0001 pF"
    
vlsi.inputs.input_loads:
  - name: "TRUE0*"
    load: "0.0035 pF"
  - name: "TRUE1*"
    load: "0.0035 pF"

vlsi.inputs:
    mmmc_corners: [
      {
        name: "tt_nominal_max_1p20v_25c",
        type: "setup",
        voltage: "1.20 V",
        temp: "25C"
      },
      {
        name: "tt_nominal_max_1p20v_25c",
        type: "hold",
        voltage: "1.2 V",
        temp: "25 C"
      },
      {
        name: "tt_nominal_max_1p20v_25c",
        type: "extra",
        voltage: "1.20 V",
        temp: "25 C"
      }
    ]
